name: publish-pypi

# PyPI Trusted Publishing（OIDC）：推送 v* tag 即触发，无需 token、无需 UI。
# PyPI 后台 Trusted Publisher 配置：
#   Project         : engramdb-python
#   Publisher       : GitHub
#   Repository      : QingGo/EngramDB
#   Workflow name   : publish.yml
#   Environment name: pypi   (与下方 job environment 一致)
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    environment: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v5
      - name: build
        run: |
          cd python
          uv build .
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
