name: publish-pypi

# PyPI 分发：tag v* 触发（与 release.yml 的 crates 发布并行）。
# 密钥：仓库 Settings -> Secrets and variables -> Actions -> PYPI_TOKEN
# （PyPI 官方建议：pypi.org Account settings -> API tokens 创建，
#   仅勾选传输项目，避免全账号权限进 CI）。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: build & publish
        run: |
          cd python
          uv build .
          uv publish dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
