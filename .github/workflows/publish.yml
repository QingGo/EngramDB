name: publish-pypi

# PyPI Trusted Publishing（OIDC）：推送 v* tag 即触发，无需 token、无需 UI。
# PyPI 后台 Trusted Publisher 配置：
#   Project         : engramdb-python
#   Publisher       : GitHub
#   Repository      : QingGo/EngramDB
#   Workflow name   : publish.yml
#   Environment name: pypi   (与下方 job environment 一致)
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  sdist:
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v5
      - name: build sdist
        run: |
          cd python
          uv build --sdist --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: python/dist/*

  wheels:
    needs: [preflight]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-aarch64
          - os: macos-15-intel
            name: macos-x86_64
          - os: macos-15
            name: macos-aarch64
    runs-on: ${{ matrix.os }}
    env:
      UV_CACHE_DIR: /tmp/uvcache
      CARGO_HOME: /tmp/cargo-home
      RUSTFLAGS: ${{ runner.os == 'macOS' && '-C link-arg=-undefined -C link-arg=dynamic_lookup' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v5
      - name: build wheel
        run: |
          cd python
          uv build --wheel --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.name }}
          path: python/dist/*

  pypi:
    needs: [sdist, wheels]
    environment: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
