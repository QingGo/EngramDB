name: publish-pypi

# PyPI Trusted Publishing（OIDC）：推送 v* tag 即触发，无需 token、无需 UI。
# PyPI 后台 Trusted Publisher 配置：
#   Project         : engramdb-python
#   Publisher       : GitHub
#   Repository      : QingGo/EngramDB
#   Workflow name   : publish.yml
#   Environment name: pypi   (与下方 job environment 一致)
on:
  push:
    tags: ["v*"]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  pypi:
    needs: [preflight]
    environment: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: install maturin with zig support
        run: python -m pip install "maturin[zig]"
      - name: build sdist + wheel
        run: |
          cd python
          maturin sdist --out dist
          maturin build --release --out dist --compatibility manylinux2014 --zig
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
