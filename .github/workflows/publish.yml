name: publish-pypi

# PyPI Trusted Publishing（OIDC）：推送 v* tag 即触发，无需 token、无需 UI。
# PyPI 后台 Trusted Publisher 配置：
#   Project         : engramdb-python
#   Publisher       : GitHub
#   Repository      : QingGo/EngramDB
#   Workflow name   : publish.yml
#   Environment name: pypi   (与下方 job environment 一致)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  build:
    needs: [preflight]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
            build_args: --compatibility manylinux2014 --zig
          - os: ubuntu-24.04-arm
            artifact: linux-aarch64
            build_args: --compatibility manylinux2014 --zig
          - os: macos-15-intel
            artifact: macos-x86_64
            build_args: ""
          - os: macos-15
            artifact: macos-aarch64
            build_args: ""
          - os: windows-latest
            artifact: windows-x86_64
            build_args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: install maturin with zig support
        run: python -m pip install "maturin[zig]"
      - name: build wheel
        run: |
          cd python
          maturin build --release --out dist ${{ matrix.build_args }}
      - name: upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.artifact }}
          path: python/dist/*

  sdist:
    needs: [preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: install maturin
        run: python -m pip install maturin
      - name: build sdist
        run: |
          cd python
          maturin sdist --out dist
      - name: upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: python/dist/*

  pypi:
    needs: [build, sdist]
    environment: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: show artifacts
        run: ls -R dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
