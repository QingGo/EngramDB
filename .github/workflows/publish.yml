name: publish-pypi

# PyPI Trusted Publishing（OIDC）：GitHub Release 发布事件触发，与 release.yml（crates.io）同步。
# PyPI 后台 Trusted Publisher 配置：
#   Project         : engramdb-python
#   Publisher       : GitHub
#   Repository      : QingGo/EngramDB
#   Workflow name   : publish.yml
#   Environment name: pypi   (与下方 job environment 一致)
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    environment: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@v5
      - name: build
        run: |
          cd python
          uv build .
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
