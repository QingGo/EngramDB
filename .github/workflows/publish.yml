name: publish-pypi

# PyPI Trusted Publishing（OIDC）：推送 v* tag 即触发，无需 token、无需 UI。
# PyPI 后台 Trusted Publisher 配置：
#   Project         : engramdb-python
#   Publisher       : GitHub
#   Repository      : QingGo/EngramDB
#   Workflow name   : publish.yml
#   Environment name: pypi   (与下方 job environment 一致)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  pypi:
    needs: [preflight]
    environment: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - name: install auditwheel
        run: python -m pip install auditwheel
      - name: build sdist + wheel
        run: |
          cd python
          uv build .
          mkdir -p dist_upload
          cp dist/*.tar.gz dist_upload/
          python -m auditwheel repair dist/*.whl -w dist_upload --plat manylinux2014_x86_64
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist_upload
