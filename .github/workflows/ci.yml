name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --workspace

  python-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: install maturin with zig support
        run: python -m pip install "maturin[zig]"
      - name: build wheel
        run: |
          cd python
          if [ "$RUNNER_OS" = "Linux" ]; then
            maturin build --release --out dist --compatibility manylinux2014 --zig
          else
            maturin build --release --out dist
          fi
      - name: install wheel
        run: python -m pip install --force-reinstall python/dist/*.whl
      - name: run smoke
        run: python scripts/python_wheel_smoke.py
      - name: run service smoke
        run: python scripts/service_smoke.py
