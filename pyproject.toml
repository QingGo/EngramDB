[project]
name = "engramdb-tools"
version = "0.1.0"
description = "EngramDB research/analysis tooling (Python): corpus stats, PLE reference hashing, downloads"
requires-python = ">=3.11"
dependencies = [
    "tokenizers>=0.22",
    "numpy>=2.0",
    "pyarrow>=18",
    "modelscope>=1.32",
]

[dependency-groups]
dev = []

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
