[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "engramdb-python"
version = "0.2.5"
description = "Disk-first storage engine for Engram/PLE n-gram memory tables (Rust core, Python bindings)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "EngramDB Authors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

[tool.maturin]
module-name = "engramdb._engramdb"
manifest-path = "../crates/engramdb-pyo3/Cargo.toml"
features = ["pyo3/extension-module"]
exclude = ["__pycache__", "**/*.pyc", ".DS_Store"]
