[package]
name = "engramdb"
version = "0.2.2"
edition = "2021"
license = "Apache-2.0"
description = "Disk-first storage engine for Engram/PLE n-gram memory tables: build/index/warm/verify/inspect"
repository = "https://github.com/QingGo/EngramDB"
categories = ["database", "filesystem"]
keywords = ["engram", "ple", "ngram", "disk", "embedding"]
readme = "../../README.md"

[dependencies]
engramdb-core = { path = "../engramdb-core", version = "0.2.2" }
engramdb-io = { path = "../engramdb-io", version = "0.2.2" }
engramdb-keygen = { path = "../engramdb-keygen", version = "0.2.2" }
serde_json = "1"
