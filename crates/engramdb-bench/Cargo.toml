[package]
name = "engramdb-bench"
version = "0.2.9"
edition = "2021"
license = "Apache-2.0"
description = "M0 probe bench harness (P1-P6)"

[dependencies]
serde_json = "1"
libc = "0.2"
engramdb-keygen = { path = "../engramdb-keygen" }
engramdb-core = { path = "../engramdb-core" }
engramdb-io = { path = "../engramdb-io" }

[[bin]]
name = "p4view"
path = "src/bin/p4view.rs"

[[bin]]
name = "p3sim"
path = "src/bin/p3sim.rs"

[[bin]]
name = "p2rowid"
path = "src/bin/p2rowid.rs"
