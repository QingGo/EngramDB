[package]
name = "engramdb-python"
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
description = "C ABI / ctypes binding for EngramDB (offline-first minimal Python bridge)"

[lib]
name = "engramdb_c"
crate-type = ["cdylib", "rlib"]

[dependencies]
engramdb-core = { path = "../engramdb-core" }
engramdb-io = { path = "../engramdb-io" }
