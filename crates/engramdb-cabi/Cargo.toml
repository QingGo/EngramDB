[package]
name = "engramdb-cabi"
version = "0.2.12"
edition = "2021"
license = "Apache-2.0"
description = "EngramDB C ABI: the C/C++ embedding surface (NOT a Python backend; Python uses engramdb-pyo3)"

[lib]
name = "engramdb_c"
crate-type = ["cdylib", "rlib"]

[dependencies]
engramdb-core = { path = "../engramdb-core" }
engramdb-io = { path = "../engramdb-io" }
engramdb-keygen = { path = "../engramdb-keygen" }
