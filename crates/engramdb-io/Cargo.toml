[package]
name = "engramdb-io"
version = "0.2.12"
edition = "2021"
license = "Apache-2.0"
description = "EngramDB IO layer: badge batch reader, tier manager, prefetch planner (io_uring/preadv later)"
repository = "https://github.com/QingGo/EngramDB"

[dependencies]
engramdb-core = { path = "../engramdb-core", version = "0.2.12" }
engramdb-keygen = { path = "../engramdb-keygen", version = "0.2.12" }
serde_json = "1"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"
